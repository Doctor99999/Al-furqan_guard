services:
  - type: web
    name: al-furqan-guard
    runtime: docker
    # Production launch: "starter" (paid) is required for the persistent 1GB Disk below.
    # Runtime state (SQLite analytics, B2B keys, feedback) is written to /app/data,
    # so deploy/restart survives only when this Disk is mounted. Free tier has no disk.
    plan: starter
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: runtime-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # --- Secrets (sync:false => create in the Render Dashboard, never committed) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: IP_HASH_SECRET
        sync: false
      # --- Optional (uncomment only if needed) ---
      # - key: DATABASE_URL
      #   sync: false
      # - key: B2B_DEMO_API_KEY
      #   sync: false
      # - key: CORS_ORIGINS
      #   value: https://your-custom-domain.com
      # - key: LOG_LEVEL
      #   value: INFO
      # --- Auto-config: public URL of this service (enables Telegram webhook mode) ---
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: al-furqan-guard
          property: host