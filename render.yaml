services:
  - type: web
    name: al-furqan-guard
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt -c requirements.lock
    startCommand: python start_all.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIP_ROOT_USER_ACTION
        value: ignore
      - key: TELEGRAM_BOT_TOKEN
        sync: false
